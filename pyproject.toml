[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "compart"
version = "1.0.4"
description = "Compart — the agent workspace for developers. Kernel-enforced isolation, zero configuration, Git-style workflows."
requires-python = ">=3.10"
license = { text = "ELv2" }
keywords = ["ai-agents", "developer-tools", "sandbox", "isolation", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "blake3>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
compart = "compart.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Devaretanmay/Compart"
Repository = "https://github.com/Devaretanmay/Compart"
Issues = "https://github.com/Devaretanmay/Compart/issues"

[tool.maturin]
features = ["pyo3-binding"]
python-source = "python"
module-name = "compart._core"

[tool.pytest.ini_options]
# Tests import the installed compart package, not the source tree.
# (The source tree intentionally contains no compiled _core.*.so; the native
# module ships inside the wheel, so importing source here would silently lose
# the sandbox/compression core.)
testpaths = ["tests"]
