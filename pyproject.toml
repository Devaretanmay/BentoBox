[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "bentoworks"
version = "0.9.1"
description = "BentoBox - kernel-level sandbox with compartmentalized isolated execution for any coding agent."
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
keywords = ["ai-agents", "developer-tools", "sandbox", "isolation", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.urls]
Homepage = "https://github.com/Devaretanmay/BentoBox"
Repository = "https://github.com/Devaretanmay/BentoBox"
Issues = "https://github.com/Devaretanmay/BentoBox/issues"

[tool.maturin]
features = ["pyo3-binding"]
python-source = "python"
module-name = "bentoworks._core"


[project.scripts]
bentoworks = "bentoworks.cli:main"

[tool.pytest.ini_options]
# Tests import the installed bentoworks package, not the source tree.
# (The source tree intentionally contains no compiled _core.*.so; the native
# module ships inside the wheel, so importing source here would silently lose
# the sandbox/compression core.)
testpaths = ["tests"]
