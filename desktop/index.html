<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Titlebar -->
  <header class="titlebar">
    <div class="titlebar-left">
      <div class="traffic-lights">
        <span class="dot dot-close"></span>
        <span class="dot dot-minimize"></span>
        <span class="dot dot-zoom"></span>
      </div>
      <span class="titlebar-label" id="sys-sandbox-type">Seatbelt</span>
      <span class="titlebar-meta" id="sys-python"></span>
    </div>
    <div class="titlebar-center">
      <span class="titlebar-repo" id="workspace-path">compart-workspace</span>
    </div>
    <div class="titlebar-right">
      <span class="status-pill idle" id="status-pill">Idle</span>
    </div>
  </header>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">C</div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" title="Runner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button class="nav-btn" title="History" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </button>
        <button class="nav-btn" title="Vault" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </nav>
    </aside>

    <!-- Panel 1: Run Configuration -->
    <section class="panel panel-config">
      <div class="panel-head">
        <h2>Run</h2>
      </div>

      <div class="panel-body">
        <!-- Command -->
        <div class="field">
          <label>Command</label>
          <input type="text" id="cmd-input" placeholder="ls -la" spellcheck="false">
        </div>

        <!-- Workdir -->
        <div class="field">
          <label>Working Directory</label>
          <div class="workdir-display" id="workdir-display"></div>
        </div>

        <!-- Permissions -->
        <div class="field">
          <label>Permissions</label>
          <div class="perm-grid">
            <label class="perm"><input type="checkbox" id="p-read" checked><code>fs_read</code></label>
            <label class="perm"><input type="checkbox" id="p-write"><code>fs_write</code></label>
            <label class="perm"><input type="checkbox" id="p-exec" checked><code>fs_exec</code></label>
            <label class="perm"><input type="checkbox" id="p-net"><code>network</code></label>
          </div>
        </div>

        <!-- Toggles -->
        <div class="field">
          <label>Sandbox</label>
          <div class="toggle-row">
            <span>Kernel enforcement</span>
            <input type="checkbox" id="t-sandbox" class="toggle">
          </div>
          <div class="toggle-row">
            <span>Block network</span>
            <input type="checkbox" id="t-network" class="toggle" checked>
          </div>
        </div>

        <!-- Run button -->
        <button class="btn-run" id="btn-run">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Run Sandboxed
        </button>
      </div>
    </section>

    <!-- Panel 2: Terminal Output -->
    <section class="panel panel-terminal">
      <div class="panel-head">
        <h2>Output</h2>
        <div class="output-meta" id="output-meta"></div>
      </div>
      <pre class="terminal" id="terminal"><span class="term-hint">Run a command to see output here.</span></pre>
    </section>

    <!-- Panel 3: File Diffs -->
    <section class="panel panel-diffs">
      <div class="panel-head">
        <h2>Changes</h2>
        <button class="btn-rollback" id="btn-rollback" disabled>Rollback</button>
      </div>
      <div class="diff-list" id="diff-list">
        <div class="diff-empty" id="diff-empty">No file changes detected.</div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
