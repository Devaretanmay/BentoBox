[package]
name = "compart-native"
version = "1.0.4"
edition = "2021"
description = "Node/TypeScript binding for the Compart kernel sandbox"
license = "ELv2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
compart-core = { path = "../../.." }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
