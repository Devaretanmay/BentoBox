[package]
name = "bentoworks-native"
version = "0.1.0"
edition = "2021"
description = "Node/TypeScript binding for the BentoBox kernel sandbox"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bentoworks-core = { path = "../../.." }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
