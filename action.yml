name: 'BentoBox CI Security & Speed Setup'
description: 'OS-kernel sandboxing and workspace state protection for CI steps.'
author: 'BentoWorks'

inputs:
  network:
    description: 'Allow network egress by default for pipeline steps (default: false / network blocked)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install BentoWorks & Dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv .venv
        echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=${PWD}/.venv" >> "$GITHUB_ENV"
        .venv/bin/python -m pip install --upgrade pip maturin pytest
        if [ -f "pyproject.toml" ]; then
          .venv/bin/maturin develop --release
        else
          .venv/bin/python -m pip install bentoworks
        fi

    - name: Initialize BentoBox CI Environment
      shell: bash
      run: |
        .venv/bin/python -m bentoworks.ci.setup --network ${{ inputs.network }}
