name: 'BentoBox CI Security & Speed Setup'
description: 'Zero-cost, zero-infrastructure OS kernel sandboxing and sub-millisecond state resets for CI steps.'
author: 'BentoWorks'

inputs:
  network:
    description: 'Allow network egress by default for pipeline steps (default: false / network blocked)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install BentoWorks & Dependencies
      shell: bash
      run: |
        python3 -m pip install --upgrade pip maturin pytest || true
        if [ -f "pyproject.toml" ]; then
          maturin develop --release || python3 -m pip install -e . || pip install -e .
        else
          python3 -m pip install bentoworks || pip install bentoworks
        fi

    - name: Initialize BentoBox CI Environment
      shell: bash
      run: |
        python3 -m bentoworks.ci.setup --network ${{ inputs.network }}
