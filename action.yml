name: 'BentoBox CI Security & Speed Setup'
description: 'OS-kernel sandboxing and workspace state protection for CI steps.'
author: 'BentoWorks'

inputs:
  network:
    description: 'Allow network egress by default for pipeline steps (default: false / network blocked)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install BentoWorks & Dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade pip maturin pytest
        if [ -f "pyproject.toml" ]; then
          maturin develop --release
        else
          python3 -m pip install bentoworks
        fi

    - name: Initialize BentoBox CI Environment
      shell: bash
      run: |
        python3 -m bentoworks.ci.setup --network ${{ inputs.network }}
