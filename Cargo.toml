[package]
name = "compart-core"
version = "1.0.1"
edition = "2021"
license = "ELv2"
description = "Compart - kernel-level sandbox with compartmentalized isolated execution (Rust core)"
repository = "https://github.com/Devaretanmay/Compart"
homepage = "https://github.com/Devaretanmay/Compart"
documentation = "https://docs.rs/crate/compart-core"
keywords = ["ai", "mcp", "compression", "execution", "sandbox"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "compart_core"
crate-type = ["cdylib", "lib"]

[features]
default = []
# Python extension module (enabled by maturin). Plain `cargo build`
# without this feature produces a clean FFI cdylib for the TS SDK.
pyo3-binding = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py38"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py38"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
regex = "1"
flate2 = "1"
aho-corasick = "1"
blake3 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
